name: BioGuard API tests

on:
  push:
    branches:
      - main
      - frontend/vanilla-js-redesign
  pull_request:
    branches:
      - main

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-api.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify root npm install
        run: npm ci --ignore-scripts
      - name: Verify frontend-root npm install
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Verify static frontend build scripts
        run: npm run build && npm --prefix frontend run build
      - name: Install API dependencies
        run: python -m pip install -r requirements-api.txt
      - name: Build API container image
        run: docker build -t bioguard-x-api:ci .
      - name: Check Python compilation
        run: python -m compileall -q api src scripts tests
      - name: Check Vanilla JavaScript syntax
        run: node --check frontend/config.js && node --check frontend/app.js && node --check frontend/modules.js
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run API and ML tests
        env:
          BIOGUARD_API_TOKEN: ci-test-token
          BIOGUARD_ENCRYPTION_KEY: ${{ secrets.BIOGUARD_CI_ENCRYPTION_KEY }}
        run: python -m pytest tests -q
