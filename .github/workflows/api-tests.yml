name: BioGuard API tests

on:
  push:
    branches:
      - main
      - frontend/vanilla-js-redesign
  pull_request:
    branches:
      - main

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-api.txt
      - name: Install API dependencies
        run: python -m pip install -r requirements-api.txt
      - name: Run API tests
        env:
          BIOGUARD_API_TOKEN: ci-test-token
          BIOGUARD_ENCRYPTION_KEY: ${{ secrets.BIOGUARD_CI_ENCRYPTION_KEY }}
        run: python -m pytest tests/test_api.py -q
